<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدويتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-column stack of medicine cards, photo slot on the right, name on the left, export bar at the end */
:root{
  --bg:#f1f5f3; --card:#ffffff; --ink:#12302a; --mute:#5b726c; --line:#d3dfda;
  --accent:#0f766e; --accent-ink:#ffffff; --soft:#e2f1ee; --warn:#a15c07; --danger:#b42318;
  --font-display:'Tajawal',system-ui,sans-serif; --font-body:'Tajawal',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1816; --card:#16251f; --ink:#e6f2ee; --mute:#9bb3ac; --line:#2a3d36;
    --accent:#2dd4bf; --accent-ink:#06211c; --soft:#1b3a33; --warn:#f0b35a; --danger:#ff8f85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1816; --card:#16251f; --ink:#e6f2ee; --mute:#9bb3ac; --line:#2a3d36;
  --accent:#2dd4bf; --accent-ink:#06211c; --soft:#1b3a33; --warn:#f0b35a; --danger:#ff8f85;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{font-family:var(--font-display);font-weight:800;font-size:30px;margin:0;color:var(--accent);text-wrap:balance}
.count{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.hint{margin:0 0 16px;color:var(--mute);font-size:14px}
#list{display:flex;flex-direction:column;gap:12px}
.card{position:relative;display:grid;grid-template-columns:116px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.num{position:absolute;top:-10px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0 7px;font-variant-numeric:tabular-nums}
.shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:116px;height:116px;border-radius:12px;border:2px dashed var(--accent);background:var(--soft);color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;overflow:hidden}
.shot:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.shot.has{border-style:solid;border-color:var(--line)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .retake{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;text-align:center;padding:3px 0}
.shot svg{width:36px;height:36px}
.shot input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;font-size:0}
.shot{justify-content:stretch;gap:0;cursor:default}
.opts{position:relative;z-index:2;display:flex;flex-direction:column;width:100%;height:100%}
.shot.has .opts{position:absolute;inset:auto 0 0 0;height:34px;flex-direction:row;background:rgba(0,0,0,.62)}
.opt{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
.shot.has .opt{color:#fff;font-size:12px;gap:4px}
.opt+.opt{border-top:1px solid var(--accent)}
.shot.has .opt+.opt{border-top:0;border-inline-start:1px solid rgba(255,255,255,.4)}
.shot .opt svg{width:22px;height:22px}
.shot.has .opt svg{width:15px;height:15px}
.info{display:flex;flex-direction:column;gap:6px;min-width:0}
.info label{font-size:13px;color:var(--mute);font-weight:500}
textarea{width:100%;flex:1;min-height:60px;resize:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:17px;font-weight:700;line-height:1.35}
textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.status{font-size:13px;color:var(--mute)}
.status.warn{color:var(--warn)}
.status.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-inline-end:6px;vertical-align:-1px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.status.busy::before{animation:none}}
.del{border:0;background:none;color:var(--danger);font-family:inherit;font-size:13px;padding:6px 4px;cursor:pointer}
.add{margin-top:14px;width:100%;min-height:52px;border-radius:14px;border:2px dashed var(--accent);background:transparent;color:var(--accent);font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.share{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.share h2{margin:0 0 4px;font-size:20px;font-family:var(--font-display)}
.share p{margin:0 0 12px;color:var(--mute);font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:8px 10px;border-radius:12px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-family:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);grid-column:1/-1}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
pre{white-space:pre-wrap;word-break:break-word;margin:14px 0 0;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-family:inherit;font-size:15px;max-height:220px;overflow:auto}
.preview{margin-top:14px;display:none}
.preview.on{display:block}
.preview img{width:100%;border-radius:10px;border:1px solid var(--line)}
.preview small{display:block;margin-top:6px;color:var(--mute)}
#toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.patient{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.patient label{font-size:13px;color:var(--mute);font-weight:500}
.patient input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:18px;font-weight:700}
.patient input:focus{outline:3px solid var(--accent);outline-offset:1px}
.acts{display:flex;align-items:center;justify-content:space-between;gap:8px}
.crop{border:1px solid var(--accent);background:var(--soft);color:var(--accent);border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer}
#cropper{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
#cropper.on{display:flex}
#cropper .top{position:relative;z-index:2;color:#fff;padding:14px 16px;font-size:16px;text-align:center;background:#111}
#cropper .stagewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px;overflow:hidden}
#stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0}
#stage img{max-width:calc(100vw - 16px);max-height:calc(100vh - 270px);display:block;pointer-events:none}
#sel{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);display:none;pointer-events:none}
#cropper .bar{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px;background:#111}
#cropper .bar button{min-height:48px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
#cropper .bar button.ghost{background:transparent;color:#fff;border-color:#888}
.btn.wa{background:var(--accent);color:var(--accent-ink)}
.share{margin-top:20px;padding:12px}
.dose{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dose select{flex:1;min-width:110px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;padding:0 6px}
.startbtn{min-height:36px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:inherit;font-size:13px;font-weight:700;padding:0 12px;cursor:pointer}
.next{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.cal{border:0;background:none;color:var(--accent);font-family:inherit;font-size:12px;font-weight:700;text-decoration:underline;padding:2px;cursor:pointer}
.card{grid-template-columns:100px 1fr;gap:10px;padding:10px}
.shot{width:100px;height:100px}
.info{gap:5px}
.info textarea{flex:none;min-height:42px;max-height:92px;field-sizing:content;font-size:16px}
.row{flex-wrap:wrap;min-height:0;gap:4px 8px}
.row .status{flex:1 1 100%}
.row .status:empty{display:none}
.mini{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.next{font-size:11.5px;gap:6px}
.shot.has .opt svg{display:none}
.shot.has .opt{font-size:12px}
.shot.has img{cursor:pointer}
.note{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.note:focus{outline:3px solid var(--accent);outline-offset:1px}
.notebtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-family:inherit;font-size:13px;font-weight:700;padding:6px 2px;cursor:pointer}
.notebtn svg{width:16px;height:16px}
.mini{flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.dates{display:flex;gap:8px}
.dates label{flex:1;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mute);min-width:0}
.dates input{min-height:36px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;padding:0 6px}
.reason{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.reason:focus,.dates input:focus{outline:3px solid var(--accent);outline-offset:1px}
.since{font-size:11.5px;color:var(--mute)}
.stopbtn{border:1px solid var(--warn);background:none;color:var(--warn);border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:700;padding:5px 8px;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:24px 8px;font-size:15px;margin:0}
.dose .kl{font-size:13px;color:var(--mute)}
.dose input.evnum{width:56px;min-height:36px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;padding:0 4px}
.dose input.evnum:focus,.dose select:focus{outline:3px solid var(--accent);outline-offset:1px}
.dose .evunit{flex:0 0 auto;min-width:0;width:74px}
.next.off{display:none}
.next .cal[hidden]{display:none}
.dose{gap:6px}
.dose input.evnum{width:46px}
.dose .evunit{width:66px}
.startbtn{padding:0 10px}
.phs{font-size:11.5px;color:var(--mute)}
.phs:empty{display:none}
#alarm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:24px}
#alarm.on{display:flex}
#alarm .box{background:var(--card);color:var(--ink);border-radius:20px;padding:28px 20px;text-align:center;max-width:360px;width:100%}
#atext{font-size:22px;font-weight:800;margin-bottom:18px;text-wrap:balance}
#aclose{min-height:52px;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:inherit;font-size:18px;font-weight:800;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chips:empty{display:none}
.chead{font-size:11.5px;color:var(--mute)}
a.chip{display:inline-block;padding:5px 10px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);background:var(--soft);font-size:13px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.chipall{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer}
a.chip{padding:4px 8px;font-size:12.5px}
.chips{gap:5px}
textarea.pick{cursor:pointer;border-color:var(--accent);background:var(--soft)}
textarea.pick::placeholder{color:var(--accent);font-weight:700;opacity:1}
#cropper .bar{grid-template-columns:1fr 1fr 1fr}
#cropper .stagewrap{touch-action:none}
#cropper .zbtns{position:absolute;top:12px;left:12px;z-index:3;display:flex;flex-direction:column;gap:8px}
#cropper .zbtns button{width:46px;height:46px;border-radius:50%;border:1px solid #888;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;font-family:inherit;cursor:pointer}
#stage{transform-origin:0 0}
#cropper .cpanel{position:relative;z-index:2;background:#111;padding-top:10px}
#chint{padding:0 16px 8px;font-size:16px;font-weight:700;color:#fff;text-align:center;min-height:26px}
#chint.red{color:#ff5a4f}
#cname{display:block;width:calc(100% - 32px);margin:0 16px;min-height:50px;border:1px solid #666;border-radius:10px;background:#1c1c1c;color:#fff;font-family:inherit;font-size:19px;font-weight:700;padding:0 12px;text-align:center}
#cname:focus{outline:3px solid var(--accent)}
.info textarea::placeholder{font-size:13px}
.langbtn{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:8px;font-family:inherit;font-weight:800;font-size:13px;min-width:42px;min-height:32px;cursor:pointer}
html[dir=ltr] .num{right:auto;left:-6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>أدويتي</h1>
    <span class="count" id="count"></span>
    <button type="button" class="langbtn" id="lang" aria-label="Language">EN</button>
  </header>
  <div class="patient">
    <input id="patient" type="text" placeholder="اسم المريض" aria-label="اسم المريض" autocomplete="off">
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" class="on" data-tab="active" aria-selected="true">الحالية <span id="c-active"></span></button>
    <button type="button" role="tab" data-tab="stopped" aria-selected="false">المنتهية <span id="c-stopped"></span></button>
  </div>
  <section id="list" aria-label="قائمة الأدوية"></section>
  <button class="add" id="add" type="button">+ إضافة دواء</button>

  <section class="share" aria-label="مشاركة">
    <div class="btns">
      <button class="btn wa" id="wa" type="button">إرسال واتساب</button>
      <button class="btn" id="img" type="button">تنزيل استوديو</button>
    </div>
    <div class="preview" id="preview">
      <img id="pimg" alt="القائمة كصورة">
      <small>إذا لم يظهر خيار الحفظ، اضغط مطولًا على الصورة واختر حفظ.</small>
    </div>
  </section>
</div>
<div id="cropper" role="dialog" aria-label="تحديد منطقة الاسم">
  <div class="stagewrap"><div id="stage"><img id="cimg" alt="صورة الدواء"><div id="sel"></div></div></div>
  <div class="zbtns"><button type="button" id="zin" aria-label="تكبير">+</button><button type="button" id="zout" aria-label="تصغير">−</button></div>
  <div class="cpanel">
    <div id="chint" class="red">كبّر الصورة ثم حدّد</div>
    <input id="cname" type="text" autocomplete="off" placeholder="الاسم يظهر هنا بعد التحديد" aria-label="اسم الدواء">
    <div class="bar">
      <button type="button" id="csend">إرسال الاسم</button>
      <button type="button" id="clang">اللغة: تلقائي</button>
      <button type="button" id="ccancel" class="ghost">إلغاء</button>
    </div>
  </div>
</div>
<div id="alarm" role="alertdialog" aria-live="assertive"><div class="box"><div id="atext"></div><button type="button" id="aclose">تم، إغلاق</button></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
  var KEY='adwiyati-v1';
  var $=function(id){return document.getElementById(id)};

  // قراءة محلية بديلة (للملف المنفصل): تأخذ أكبر الكلمات حجمًا على العلبة، إنجليزي وعربي
  async function ocrLocal(blob){
    if(!window.Tesseract){
      await new Promise(function(res,rej){var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
    }
    async function pass(lang,minConf,rx){
      var r=await window.Tesseract.recognize(blob,lang);
      var ws=((r&&r.data&&r.data.words)||[]).filter(function(w){return w.confidence>minConf&&rx.test(w.text)});
      if(!ws.length)return null;
      var H=function(w){return w.bbox.y1-w.bbox.y0};
      var mx=Math.max.apply(null,ws.map(H));
      var big=ws.filter(function(w){return H(w)>=mx*0.7});
      var rtl=lang==='ara';
      big.sort(function(a,b){return(Math.abs(a.bbox.y0-b.bbox.y0)>mx*0.5)?a.bbox.y0-b.bbox.y0:(rtl?b.bbox.x0-a.bbox.x0:a.bbox.x0-b.bbox.x0)});
      big=big.slice(0,5);
      var txt=big.map(function(w){return w.text.replace(/[^A-Za-z0-9؀-ۿ\-]/g,'')}).filter(Boolean).join(' ').trim();
      var avg=big.reduce(function(a,w){return a+w.confidence},0)/big.length;
      return txt?{text:txt,score:avg}:null;
    }
    var en=await pass('eng',65,/[A-Za-z]{3,}/);
    if(en&&en.score>=75)return en.text;
    var ar=await pass('ara',60,/[؀-ۿ]{3,}/);
    if(en&&ar){return(ar.score>en.score+10)?ar.text:en.text}
    return en?en.text:(ar&&ar.score>=70?ar.text:'');
  }

  // قراءة منطقة حدّدها المستخدم (مكبّرة): إنجليزي أو عربي أو تلقائي
  async function ocrRegion(blob,lang){
    if(!window.Tesseract){
      await new Promise(function(res,rej){var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
    }
    async function one(l){
      var w=await window.Tesseract.createWorker(l);
      try{await w.setParameters({tessedit_pageseg_mode:'6'});var r=await w.recognize(blob);return r.data}
      finally{await w.terminate()}
    }
    function clean(t,rx){return String(t||'').split('\n').map(function(x){return x.replace(/[^A-Za-z0-9؀-ۿ\-\.\s]/g,' ').replace(/\s+/g,' ').trim()}).filter(function(x){return rx.test(x)}).join(' ').trim()}
    var en=null,ar=null,d,t;
    if(lang!=='ara'){d=await one('eng');t=clean(d.text,/[A-Za-z]{3,}/);if(t&&d.confidence>30)en={text:t,score:d.confidence}}
    if(lang!=='eng'){d=await one('ara');t=clean(d.text,/[؀-ۿ]{3,}/);if(t&&d.confidence>30)ar={text:t,score:d.confidence}}
    if(en&&ar)return en.score>=ar.score?en.text:ar.text;
    return en?en.text:(ar?ar.text:'');
  }

  function wrap(ctx,text,maxW){

    if(cur)lines.push(cur);return lines;
  }

  var phoneP=null;
  function getPhone(){
    if(phoneP)return phoneP;
    phoneP=(async function(){try{if(!window.claude||!window.claude.use)return null;return await window.claude.use('mcp')}catch(e){return null}})();
    return phoneP;
  }
  async function callDevice(tool,input){
    var mcp=await getPhone();if(!mcp)throw{code:'no_mcp'};
    var names=['claude-device','host:claude-device'],tries=[],last=null;
    if(typeof mcp.server==='function')tries.push(async function(n){var sv=await mcp.server(n);return sv[tool](input)});
    if(typeof mcp.callTool==='function'){tries.push(function(n){return mcp.callTool(n,tool,input)});tries.push(function(n){return mcp.callTool({server:n,tool:tool,input:input})})}
    for(var i=0;i<names.length;i++){for(var j=0;j<tries.length;j++){try{return await tries[j](names[i])}catch(e){last=e}}}
    throw last||{code:'no_api'};
  }
  var phoneOK=false,phoneBusy={};
  async function schedulePhone(m){
    if(phoneBusy[m.id])return;phoneBusy[m.id]=true;
    var done=0,err=null;
    try{
      var p=m.every*3600000,now=Date.now(),horizon=now+24*3600000;
      var t=m.sched?m.sched+p:m.start+(Math.floor((now-m.start)/p)+1)*p;
      var label=T('دواء: ')+(m.name.trim()||T('دواء'));
      while(t<=horizon&&done<12){
        var secs=Math.round((t-Date.now())/1000);
        if(secs<5){t+=p;continue}
        await callDevice('timer_create_v0',{duration_seconds:secs,message:label});
        m.sched=t;done++;t+=p;
      }
      if(done)phoneOK=true;
    }catch(e){err=e}
    phoneBusy[m.id]=false;save();
    if(err){
      setPh(m.id,err.code==='no_mcp'?T('منبه الهاتف غير متاح هنا. للتنبيه والصفحة مغلقة اضغط «للتقويم»، أو افتح الرابط من تطبيق Claude.'):T('تعذر ضبط منبه الهاتف (')+((err&&(err.code||err.message))||T('خطأ'))+').');
    }else if(done){
      setPh(m.id,T('تم ضبط ')+done+T(' منبه على الهاتف حتى ')+timeStr(m.sched,m.every<0.05)+'.');
    }
  }
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('[data-start]');
    if(b){
      var m=find(b.dataset.start);if(!m)return;
      if(!m.every){toast(T('اكتب الرقم أولًا (كل كم ساعة).'));return}
      m.start=Date.now();m.seen=0;m.sched=0;save();b.textContent=T('أخذتها الآن');updateNext(m.id);unlockAudio();setPh(m.id,'');if(!window.Android)schedulePhone(m);
      try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(err){}
      return;
    }
    var c=e.target.closest('[data-cal]');
    if(c){
      var mm=find(c.dataset.cal);if(!mm||!mm.start||!mm.every)return;
      var blob=new Blob([icsFor(mm)],{type:'text/calendar'});
      saveBlob(blob,'adwiyati-'+mm.id+'.ics').then(
        function(){toast(T('تم حفظ الملف. افتحه ليُضاف التذكير إلى التقويم (7 أيام).'),6000)},
        function(){toast(T('تعذر حفظ الملف.'))});
    }
  });

  $('list').addEventListener('click',function(e){
    var n=e.target.closest('[data-note]');if(!n)return;
    var id=n.dataset.note;openNotes[id]=true;render();
    var el=document.querySelector('[data-id="'+id+'"] .note');if(el)el.focus();
  });

  // ---------- تحديد منطقة الاسم ----------
  var cropId=null,cropLang='auto',cropRect=null,cropUrl=null;
  var LANGS=['auto','eng','ara'],LNAME={auto:T('تلقائي'),eng:T('إنجليزي'),ara:T('عربي')};
  function openCrop(id){
    var m=find(id);if(!m||!m.img)return;
    cropId=id;cropRect=null;$('sel').style.display='none';
    if(cropUrl){URL.revokeObjectURL(cropUrl);cropUrl=null}
    var src=m.img;
    if(fulls[id]){cropUrl=URL.createObjectURL(fulls[id]);src=cropUrl}
    $('cimg').src=src;
    $('cropper').classList.add('on');
    resetZoom();
    $('cname').value=m.name||'';setHint(T('كبّر الصورة ثم حدّد'),true);readSeq++;cnameEdited=false;
  }
  function closeCrop(){$('cropper').classList.remove('on');cropId=null}
  var zs=1,ztx=0,zty=0;
  function applyZoom(){$('stage').style.transform='translate('+ztx+'px,'+zty+'px) scale('+zs+')'}
  function resetZoom(){zs=1;ztx=0;zty=0;applyZoom()}
  (function(){
    var wrap=document.querySelector('#cropper .stagewrap'),sel=$('sel'),img=$('cimg'),stg=$('stage');
    var ptrs={},x0=0,y0=0,drawing=false,pinch=null;
    function base(){var r=stg.getBoundingClientRect();return{x:r.left-ztx,y:r.top-zty}}
    function pos(e){var r=img.getBoundingClientRect();return{x:Math.min(Math.max(e.clientX-r.left,0),r.width),y:Math.min(Math.max(e.clientY-r.top,0),r.height),w:r.width,h:r.height}}
    function zoomAt(cx,cy,ns,ncx,ncy){
      var b=base();ns=Math.min(8,Math.max(1,ns));
      var lx=(cx-b.x-ztx)/zs,ly=(cy-b.y-zty)/zs;
      zs=ns;ztx=ncx-b.x-lx*zs;zty=ncy-b.y-ly*zs;
      if(zs<=1.001){zs=1;ztx=0;zty=0}
      applyZoom();
    }
    function two(){var k=Object.keys(ptrs),a=ptrs[k[0]],b=ptrs[k[1]];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}}
    wrap.addEventListener('pointerdown',function(e){
      ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
      try{wrap.setPointerCapture(e.pointerId)}catch(err){}
      var n=Object.keys(ptrs).length;
      if(n===1){var p=pos(e);x0=p.x;y0=p.y;drawing=true;cropRect=null;sel.style.display='none'}
      else if(n===2){drawing=false;cropRect=null;sel.style.display='none';pinch=two()}
    });
    wrap.addEventListener('pointermove',function(e){
      if(!ptrs[e.pointerId])return;
      ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
      if(pinch&&Object.keys(ptrs).length===2){
        var t=two();zoomAt(pinch.cx,pinch.cy,zs*t.d/pinch.d,t.cx,t.cy);pinch=t;return;
      }
      if(!drawing)return;
      var p=pos(e),x=Math.min(x0,p.x),y=Math.min(y0,p.y),w=Math.abs(p.x-x0),h=Math.abs(p.y-y0);
      cropRect={x:x,y:y,w:w,h:h,iw:p.w,ih:p.h};
      sel.style.display='block';sel.style.left=(x/zs)+'px';sel.style.top=(y/zs)+'px';sel.style.width=(w/zs)+'px';sel.style.height=(h/zs)+'px';
    });
    function up(e){
      delete ptrs[e.pointerId];
      var n=Object.keys(ptrs).length;
      if(n<2)pinch=null;
      var was=drawing;
      if(n===0)drawing=false;
      if(was&&n===0&&e.type==='pointerup'&&cropRect&&cropRect.w>=12&&cropRect.h>=12)runCropRead();
    }
    wrap.addEventListener('pointerup',up);
    wrap.addEventListener('pointercancel',up);
    wrap.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,zs*(e.deltaY<0?1.25:0.8),e.clientX,e.clientY)},{passive:false});
    function step(f){var r=wrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;zoomAt(cx,cy,zs*f,cx,cy)}
    $('zin').addEventListener('click',function(){step(1.5)});
    $('zout').addEventListener('click',function(){step(1/1.5)});
  })();
  $('list').addEventListener('click',function(e){
    if(e.target.matches('textarea.pick')){openCrop(e.target.closest('.card').dataset.id);return}
    if(e.target.matches('.shot img')){openCrop(e.target.closest('.card').dataset.id)}
  });
  $('ccancel').addEventListener('click',closeCrop);
  $('clang').addEventListener('click',function(){cropLang=LANGS[(LANGS.indexOf(cropLang)+1)%LANGS.length];this.textContent=T('اللغة: ')+LNAME[cropLang];if(cropRect&&cropRect.w>=12&&cropRect.h>=12)runCropRead()});
  var readSeq=0,cnameEdited=false;
  $('cname').addEventListener('input',function(){cnameEdited=true});
  function setHint(t,red){var h=$('chint');h.textContent=t;h.classList.toggle('red',!!red)}
  async function makeRegion(){
    var cr=cropRect,img=$('cimg');
    var sx=cr.x/cr.iw*img.naturalWidth,sy=cr.y/cr.ih*img.naturalHeight,sw=cr.w/cr.iw*img.naturalWidth,sh=cr.h/cr.ih*img.naturalHeight;
    var k=Math.min(3,Math.max(1,1400/sw));if(sw*k>2600)k=2600/sw;
    var tw=Math.max(1,Math.round(sw*k)),th=Math.max(1,Math.round(sh*k));
    var c=document.createElement('canvas');c.width=tw;c.height=th;
    var ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    var c2=document.createElement('canvas');c2.width=tw;c2.height=th;
    var x2=c2.getContext('2d');x2.filter='grayscale(1) contrast(1.35)';x2.drawImage(c,0,0);
    var tb=function(cv){return new Promise(function(res){cv.toBlob(res,'image/jpeg',0.92)})};
    return{color:await tb(c),bw:await tb(c2),lang:cropLang};
  }
  async function regionText(region){
    var s=await getSample();
    if(s){
      var prompt=T('هذه صورة مقتطعة من علبة دواء فيها اسم الدواء. اكتب النص الظاهر كاسم للدواء كما هو مكتوب (عربي أو إنجليزي أو الاثنين)')+(region.lang==='ara'?T('، والاسم بالعربية'):region.lang==='eng'?T('، والاسم بالإنجليزية'):'')+T('، في سطر واحد بدون شرح. إذا لم تستطع اكتب: غير واضح');
      var out=await s(prompt,{images:[region.color],modelTier:'default',cache:false});
      var t=(out&&out.text||'').split('\n')[0].replace(/[*_`"“”]/g,'').trim();
      return /^غير واضح/.test(t)?'':t;
    }
    return await ocrRegion(region.bw,region.lang);
  }
  async function runCropRead(){
    var id=cropId;if(!id||!cropRect)return;
    var seq=++readSeq;cnameEdited=false;
    setHint(T('جارٍ قراءة الاسم...'),false);
    try{
      var region=await makeRegion();
      var t=await regionText(region);
      if(seq!==readSeq||cropId!==id)return;
      if(t){if(!cnameEdited)$('cname').value=t;setHint('',false)}
      else setHint(T('لم أستطع قراءة الاسم. اكتبه أو حدّد منطقة أخرى.'),true);
    }catch(e){
      if(seq!==readSeq||cropId!==id)return;
      setHint(T('تعذرت القراءة (تحتاج إنترنت). اكتب الاسم.'),true);
    }
  }
  $('csend').addEventListener('click',function(){
    var id=cropId,m=id&&find(id);if(!m)return;
    var v=$('cname').value.trim();
    if(!v){toast(T('حدّد الاسم أو اكتبه أولًا.'));return}
    m.name=v;if(!m.from)m.from=Date.now();ui[id]={};save();closeCrop();render();
  });

  // ---------- التبويبات ----------
  function setTabUI(){
    document.querySelectorAll('[data-tab]').forEach(function(b){var on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false')});
    $('add').textContent=tab==='active'?T('+ إضافة دواء'):T('+ إضافة دواء سابق');
  }
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click',function(){tab=b.dataset.tab;setTabUI();render();window.scrollTo(0,0)});
  });

  // اسم المريض
  var pat=$('patient');
  try{pat.value=localStorage.getItem(KEY+'-patient')||''}catch(e){}
  pat.addEventListener('input',function(){try{localStorage.setItem(KEY+'-patient',pat.value)}catch(e){}});

  function showPreview(blob){
    if(lastUrl)URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(blob);
    $('pimg').src=lastUrl;$('preview').classList.add('on');
    $('preview').scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  // حفظ الصورة (التنزيلات أو حفظ Claude)
  async function saveBlob(blob,fname){
    fname=fname||'adwiyati.png';
    if(window.Android&&Android.shareFile){
      var b64=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.onerror=rej;fr.readAsDataURL(blob)});
      Android.shareFile(fname,blob.type||'application/octet-stream',b64);
      return;
    }
    var d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(d){await d.save({filename:fname,data:blob});return}
    var u=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }

  // إرسال واتساب: مشاركة ثم نسخ ثم حفظ
  $('wa').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;
    try{
      var blob=await buildSheet();
      if(window.Android&&Android.shareFile){await saveBlob(blob,'adwiyati.png');btn.disabled=false;summary();return}
      var f=new File([blob],'adwiyati.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        try{await navigator.share({files:[f],title:T('أدويتي')});btn.disabled=false;summary();return}
        catch(e){if(e&&e.name==='AbortError'){btn.disabled=false;summary();return}}
      }
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        toast(T('تم نسخ الصورة. افتح واتساب والصقها.'));
      }catch(e){
        try{await saveBlob(blob);toast(T('تم حفظ الصورة. أرسلها من واتساب.'))}
        catch(e2){showPreview(blob);toast(T('اضغط مطولًا على الصورة لحفظها.'))}
      }
    }catch(e){toast(T('تعذر إنشاء الصورة. حاول مرة أخرى.'))}
    btn.disabled=false;summary();
  });

  // إرسال صورة: حفظها على الجهاز لإرسالها من المعرض
  $('img').addEventListener('click',async function(){
    var btn=this;btn.disabled=true;var blob=null;
    try{
      blob=await buildSheet();
      if(window.Android&&Android.saveFile){
        var b64=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.onerror=rej;fr.readAsDataURL(blob)});
        Android.saveFile('adwiyati-'+Date.now()+'.png','image/png',b64);
      }else{
        await saveBlob(blob);
        toast(T('تم تحميل الصورة.'));
      }
    }catch(e){
      if(blob){showPreview(blob);toast(T('اضغط مطولًا على الصورة لحفظها.'))}else{toast(T('تعذر إنشاء الصورة. حاول مرة أخرى.'))}
    }
    btn.disabled=false;summary();
  });

  try{document.fonts.load('700 40px Tajawal')}catch(e){}
  $('lang').textContent=LANG==='en'?'ع':'EN';
  $('lang').addEventListener('click',function(){try{localStorage.setItem('adwiyati-lang',LANG==='en'?'ar':'en')}catch(e){}location.reload()});
  if(LANG==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';document.title=T('أدويتي');trDom(document.body)}
  setTabUI();render();
  tick();setInterval(tick,2000);
})();
</script>
